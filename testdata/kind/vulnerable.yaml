# Disposable kind fixture. Do not apply this file to a shared cluster.
# The namespace is enforce=privileged so admission accepts the pods below.
# Each object is one planted issue. See README "Tests".
apiVersion: v1
kind: Namespace
metadata:
  name: posture-lab
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: posture-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: fixture
  namespace: posture-lab
type: Opaque
stringData:
  token: fixture-not-a-credential
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: posture-wildcard
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: posture-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: posture-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: User
    name: posture-alice
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: posture-wildcard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: posture-wildcard
subjects:
  - kind: User
    name: posture-dave
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: posture-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: posture-secret-reader
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: posture-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: posture-lab
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: host-share
  namespace: posture-lab
spec:
  hostPID: true
  hostNetwork: true
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: runtime-socket
  namespace: posture-lab
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: sock
          mountPath: /run/containerd/containerd.sock
  volumes:
    - name: sock
      hostPath:
        path: /run/containerd/containerd.sock
        type: Socket
---
apiVersion: v1
kind: Pod
metadata:
  name: leaky
  namespace: posture-lab
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:latest
      command: ["sleep", "3600"]
      env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: fixture
              key: token
---
apiVersion: v1
kind: Pod
metadata:
  name: old-nginx
  namespace: posture-lab
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: nginx:1.14.2
---
apiVersion: v1
kind: Service
metadata:
  name: exposed
  namespace: posture-lab
spec:
  type: LoadBalancer
  externalIPs:
    - 203.0.113.10
  selector:
    app: nobody
  ports:
    - port: 80
      targetPort: 80
